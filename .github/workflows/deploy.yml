name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Verification
        run: |
          cd backend
          npm run lint --if-present

      - name: Run Tests
        run: |
          cd backend
          npm test --if-present

      - name: Build Backend Docker Image
        run: |
          docker build -t lyvo-backend:latest ./backend

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Verification
        run: |
          cd frontend
          npm run lint --if-present

      - name: Run Tests
        run: |
          cd frontend
          npm test --if-present

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Build Frontend Docker Image
        run: |
          docker build -t lyvo-frontend:latest ./frontend
