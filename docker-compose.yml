version: '3.8'

services:
  mongodb:
    image: mongo:6.0-jammy
    container_name: lyvo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lyvo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: lyvo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lyvo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyvo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/lyvo
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_key_change_me_in_prod_12345!
      - JWT_REFRESH_SECRET=refresh_super_secret_key_change_me_in_prod_12345!
      - NODE_ENV=production
      - CLOUDINARY_CLOUD_NAME=dummy_cloudinary_cloud_name
      - CLOUDINARY_API_KEY=dummy_cloudinary_api_key
      - CLOUDINARY_API_SECRET=dummy_cloudinary_api_secret
      - RAZORPAY_KEY_ID=dummy_razorpay_key_id
      - RAZORPAY_KEY_SECRET=dummy_razorpay_key_secret
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lyvo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lyvo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lyvo-network

volumes:
  mongo-data:
  redis-data:
  backend-logs:
  backend-uploads:

networks:
  lyvo-network:
    driver: bridge
